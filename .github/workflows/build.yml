name: 构建健身记录 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安装系统依赖与字体
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev fonts-wqy-microhei
        cp /usr/share/fonts/truetype/wqy/wqy-microhei.ttc ./app_font.ttf || true

    - name: 安装 Buildozer 和 Cython
      run: |
        pip install --upgrade pip setuptools wheel
        pip install buildozer "cython<3.0"

    - name: 构建 APK
      run: |
        buildozer android debug

    - name: 上传 APK 产物
      uses: actions/upload-artifact@v4
      with:
        name: fitness-tracker-apk
        path: bin/*.apk
        retention-days: 30
